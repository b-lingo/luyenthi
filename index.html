<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="B-Lingo – Hệ thống học và luyện thi tiếng Anh THPT: Global Success 10–12, thi tốt nghiệp THPT, ĐGNL, HSG.">
<title>B-Lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: thanh tiêu đề + tab chuyên mục; cột trái = dạng bài & Test 1–10; khu chính = đề thi */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --soft:#F5F8FC; --ink:#152238; --muted:#5D6B80; --line:#DCE3EC;
  --hdr:#10284A; --hdr-2:#1A3A66; --hdr-ink:#FFFFFF; --hdr-muted:#AFC1DA;
  --brand:#2457C5; --brand-soft:#E6EDFB; --amber:#F2B32A; --amber-soft:#FDF2D3;
  --ok:#1C8552; --ok-soft:#E0F3E8; --bad:#C23B2A; --bad-soft:#FADFDA; --lock:#B26A00; --lock-soft:#FDEFD9;
  --f-head:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141D2A; --soft:#1A2535; --ink:#E4EAF2; --muted:#98A6B9; --line:#273447;
  --hdr:#0A1A31; --hdr-2:#142B4D; --hdr-ink:#F2F6FB; --hdr-muted:#8FA4C2;
  --brand:#7FA3F5; --brand-soft:#1C2B47; --amber:#F2B32A; --amber-soft:#3A3016;
  --ok:#4CC58A; --ok-soft:#16301F; --bad:#F2806C; --bad-soft:#3A1E1A; --lock:#F0B35A; --lock-soft:#3A2A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141D2A; --soft:#1A2535; --ink:#E4EAF2; --muted:#98A6B9; --line:#273447;
  --hdr:#0A1A31; --hdr-2:#142B4D; --hdr-ink:#F2F6FB; --hdr-muted:#8FA4C2;
  --brand:#7FA3F5; --brand-soft:#1C2B47; --amber:#F2B32A; --amber-soft:#3A3016;
  --ok:#4CC58A; --ok-soft:#16301F; --bad:#F2806C; --bad-soft:#3A1E1A; --lock:#F0B35A; --lock-soft:#3A2A14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr)}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- HEADER ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr);color:var(--hdr-ink)}
.hrow{display:flex;align-items:center;gap:14px;padding-block:10px;max-width:1500px;margin:0 auto}
.logo{background:var(--amber);color:#1A1300;font-family:var(--f-head);font-weight:800;border-radius:8px;padding:6px 10px;letter-spacing:.02em;border:0;white-space:nowrap}
.htitle{min-width:0;flex:1}
.htitle b{display:block;font-family:var(--f-head);font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle span{display:block;font-size:12px;color:var(--hdr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap;background:var(--hdr-2);color:var(--hdr-ink)}
.hbtn:hover{filter:brightness(1.2)}
.hbtn[aria-pressed="true"]{background:var(--amber);color:#1A1300}
.clock{font-family:var(--f-mono);font-weight:700;font-size:18px;border:1px solid var(--hdr-muted);border-radius:8px;padding:3px 10px;font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
.clock.run{background:var(--amber);color:#1A1300;border-color:var(--amber)}
.clock.low{background:var(--bad);color:#fff;border-color:var(--bad)}
.catbar{display:flex;align-items:center;gap:6px;padding-block:0 10px;overflow-x:auto;scrollbar-width:thin;max-width:1500px;margin:0 auto}
.catbar .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--hdr-muted);white-space:nowrap;margin-right:4px}
.cat{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--hdr-2);color:var(--hdr-ink);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.cat i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.cat:hover{border-color:var(--hdr-muted)}
.cat[aria-current="true"]{background:var(--surface);color:var(--ink)}
@media (max-width:820px){.htitle span,.hbtn .t{display:none}.htitle b{font-size:15px}}

/* ---------- LAYOUT ---------- */
.shell{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding-block:18px 60px}
@media (max-width:960px){.shell{grid-template-columns:1fr}}
aside.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 130px);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:960px){aside.side{position:static;max-height:none}}
.side-hd{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.side-hd h2{font-size:17px;color:var(--brand)}
.side-hd p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.side-list{overflow-y:auto;flex:1}
@media (max-width:960px){.side-list{max-height:360px}}
.tp{border-bottom:1px solid var(--line)}
.tp>button{width:100%;text-align:left;background:none;border:0;padding:12px 18px;display:flex;gap:10px;align-items:start}
.tp>button:hover{background:var(--soft)}
.tp .nm{flex:1;min-width:0}
.tp .nm b{display:block;font-family:var(--f-head);font-size:14px;font-weight:600;color:var(--brand)}
.tp .nm small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tp .car{color:var(--muted);font-size:11px;transition:transform .2s;margin-top:4px}
.tp.open .car{transform:rotate(180deg)}
.tests{display:none}
.tp.open .tests{display:block}
.trow{width:100%;display:flex;align-items:center;gap:10px;background:var(--soft);border:0;border-top:1px solid var(--line);padding:10px 18px 10px 26px;text-align:left;font-size:14px}
.trow:hover{background:var(--brand-soft)}
.trow .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.act{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand);font-weight:700;color:var(--brand)}
.trow.empty .tn{color:var(--muted)}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;font-family:var(--f-mono)}
.badge.lock{background:var(--lock-soft);color:var(--lock)}
.badge.pct{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.badge.pct.hi{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.none{color:var(--muted);font-family:var(--f-body);font-weight:500}
.catrow{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 18px;text-align:left}
.catrow:hover{background:var(--soft)}
.catrow i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.catrow span{flex:1;font-weight:600}
.catrow small{font-family:var(--f-mono);color:var(--muted);font-size:12px}

.main{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px 30px;min-width:0}
@media (max-width:560px){.main{padding:18px 14px 24px}}
.crumb{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.mhead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:start;margin:10px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.mhead h1{font-size:clamp(22px,2.6vw,28px);font-weight:700}
.mhead p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:80ch}
.mhead .acts{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 15px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.outline-ok{border-color:var(--ok);color:var(--ok)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* quick nav */
.qnav{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.qnav .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.qnav .h span:last-child{color:var(--brand);text-transform:none;letter-spacing:0}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qb{width:32px;height:32px;border-radius:6px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);font-family:var(--f-mono);font-weight:700;font-size:13px;padding:0}
.qb.on{background:var(--brand);color:#fff}
.qb.r{background:var(--ok);border-color:var(--ok);color:#fff}
.qb.w{background:var(--bad);border-color:var(--bad);color:#fff}
.qb.b{background:var(--surface);border-color:var(--muted);color:var(--muted)}

/* part */
.part{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 10px 10px 0;padding:12px 16px;margin:22px 0 14px;font-weight:600}
.passage{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;white-space:pre-line;max-width:90ch;font-size:15px}

/* player */
.player{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph .ic{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.ph b{font-family:var(--f-head);font-size:14px;letter-spacing:.02em}
.ph .tag{font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.ph small{display:block;font-size:12px;color:var(--brand)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.pbtns .btn{font-size:13px;padding:7px 12px}
.pbtns .b1{background:var(--hdr-2);border-color:var(--hdr-2);color:#fff}
.pbtns .b2{background:var(--brand);border-color:var(--brand);color:#fff}
.pbtns .b3{background:var(--amber);border-color:var(--amber);color:#1A1300}
.pbtns .b4{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pbtns select{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:600}
.pstat{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.pbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.tscript{margin-top:10px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:14px;white-space:pre-line}

/* question */
.q{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;scroll-margin-top:130px}
.q h3{font-size:16px;color:var(--brand);font-weight:700}
.q .stem{font-size:16px;margin:6px 0 12px;white-space:pre-line}
.opts{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px}
@media (max-width:1100px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);text-align:left;min-width:0}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.opt .L{font-weight:700;color:var(--brand)}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .rd{border-color:var(--brand)}
.opt.sel .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand)}
.opt.r{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.opt.r .L{color:var(--ok)}
.opt.w{border-color:var(--bad);background:var(--bad-soft)}
.opt.w .L{color:var(--bad)}
.opt:disabled{cursor:default}
.ex{margin-top:12px;border:1px dashed var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.ex b{color:var(--ok)}

.submit{display:flex;justify-content:center;margin-top:22px}
.submit .btn{font-size:16px;padding:12px 28px}
.result{border:2px solid var(--ok);background:var(--ok-soft);border-radius:14px;padding:18px 20px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.result .big{font-family:var(--f-head);font-size:44px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1}
.result .big small{font-size:18px;color:var(--muted)}
.result .m{display:flex;gap:22px;flex-wrap:wrap}
.result .m b{display:block;font-family:var(--f-mono);font-size:20px}
.result .m span{font-size:12px;color:var(--muted)}
.result .note{flex-basis:100%;font-size:14px;color:var(--muted)}

/* overview */
.ov-hero{background:var(--hdr);color:var(--hdr-ink);border-radius:12px;padding:24px 26px;margin-bottom:20px}
.ov-hero h1{font-size:clamp(22px,3vw,30px)}
.ov-hero p{color:var(--hdr-muted);margin:8px 0 0;max-width:80ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
@media (max-width:400px){.cards{grid-template-columns:1fr}}
.fcard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.fcard h3{font-size:17px}
.fcard .sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.fcard ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.fcard .go{margin-top:auto;align-self:start}

/* flashcards */
.fc-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.fc-wrap{grid-template-columns:1fr}}
.card3d{perspective:1200px;height:290px;width:100%;background:none;border:0;padding:0;display:block}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card3d .in{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;border:1px solid var(--line)}
.face.f{background:var(--hdr);color:var(--hdr-ink)}
.face.b{background:var(--surface);transform:rotateY(180deg)}
.face .w{font-family:var(--f-head);font-size:clamp(24px,3.4vw,34px);font-weight:800}
.face .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.face .vi{font-size:20px;font-weight:700;color:var(--brand)}
.face .e{font-style:italic;color:var(--muted);max-width:44ch}
.fcbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:12px}
.note{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.note h3{font-size:16px;margin-bottom:8px;color:var(--brand)}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--soft);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto}
.note p{font-size:14px;color:var(--muted);margin:8px 0 0}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--hdr);color:var(--hdr-ink);border-color:var(--hdr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-head);font-size:20px;font-variant-numeric:tabular-nums}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;min-width:0}
.panel h3{font-size:16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:64px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.qi{display:flex;gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.qi div{flex:1;min-width:0;overflow-wrap:anywhere}
.qi button{border:1px solid var(--line);background:none;border-radius:8px;padding:2px 9px;color:var(--bad);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--soft)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
code.k{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 6px;border-radius:4px}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* modal + toast */
.ovl{position:fixed;inset:0;background:rgba(8,14,24,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:420px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal h3{font-size:19px}
.modal .err{color:var(--bad);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:600;z-index:70;max-width:calc(100% - 32px)}

.qi button.ed{color:var(--brand)}

  if(c.id==="hsg9")return ({
    a:`6 câu: một đoạn nghe 130–170 từ (script), 3 câu chọn đáp án và 3 câu True/False (options đúng là ["True","False"]). Trình độ HSG lớp 9.`,

    `PHẦN LEXICO-GRAMMAR (Câu 16–52, đúng 37 câu) của đề thi chọn học sinh giỏi Tiếng Anh lớp 12 cấp tỉnh: 3 câu phát âm, 2 câu trọng âm, 8 câu từ vựng và collocation, 8 câu ngữ pháp nâng cao, 5 câu cụm động từ, 4 câu thành ngữ, 4 câu dạng từ (từ gốc IN HOA trong ngoặc), 3 câu tìm lỗi sai (4 cụm IN HOA). Mỗi dạng một part với lệnh dẫn riêng. Trình độ C1.`,

  return `8 câu trắc nghiệm phù hợp hạng mục "${n}".`;

async function saveTest(k,qs,src){
  const rec={k,qs,src:src||"edit",at:new Date().toISOString()};
  TESTS[k]=rec;
  if(DB){try{await DB.doc("tests/"+docId(k)).set(rec)}catch(e){toast("Không lưu được lên máy chủ: "+(e.message||e.code));throw e}}
  else{DRAFT[k]=rec;store.set("bl_drafts",DRAFT);rebuildTests()}
}
async function resetTest(k){
  delete TESTS[k];
  if(DB){try{await DB.doc("tests/"+docId(k)).delete()}catch(e){toast("Không xóa được: "+(e.message||e.code))}}
  else{delete DRAFT[k];store.set("bl_drafts",DRAFT);rebuildTests()}
}
async function saveCards(){
  if(DB){try{await DB.doc("cards/extra").set({list:XCARDS})}catch(e){toast("Không lưu được thẻ.")}}
  else store.set("bl_cards_local",XCARDS);
}

function openTest(c,t,n){
  const k=K(c,t,n),qs=getQs(k);
  if(!qs.length){
    if(ADMIN){AKEEP={c,t,n:String(n)};ATAB="q";go("admin");toast(`Test ${n} đang trống. Bạn có thể soạn hoặc tạo bằng AI.`)}
    else toast(`Test ${n} đang được cập nhật.`);
    return}
  const cat=catById(c);
  const mins=cat.minutes||(qs.length>=35&&cat.thptFmt?50:Math.max(5,Math.ceil(qs.length*1.5)));
  QZ={key:k,qs,ans:new Array(qs.length).fill(null),done:false,left:mins*60,start:Date.now()};
  QZ.limit=QZ.left;
  S.open[c+t]=true;go("test",{cat:c,topic:t,test:n});
}
function groupParts(qs){
  const parts=[];qs.forEach((q,i)=>{const sig=(q.i||"")+"§"+(q.s||"")+"§"+(q.p||"");const last=parts[parts.length-1];
    if(last&&last.sig===sig)last.idx.push(i);else parts.push({sig,i:q.i,s:q.s,p:q.p,idx:[i]})});return parts;
}

function submitQuiz(){
  if(!QZ||QZ.done)return;stopAudio();
  let right=0,blank=0;QZ.qs.forEach((q,i)=>{if(QZ.ans[i]===null)blank++;else if(QZ.ans[i]===q.a)right++});
  const pct=Math.round(right/QZ.qs.length*100);
  QZ.res={right,blank,wrong:QZ.qs.length-right-blank,score:right/QZ.qs.length*10,pct};QZ.done=true;
  BEST[QZ.key]=Math.max(BEST[QZ.key]||0,pct);store.set("bl_best",BEST);
  const c=catById(S.cat),t=topicOf(S.cat,S.topic);

  renderMain();renderSide();window.scrollTo(0,0);
}

function testText(withKey){
  const c=catById(S.cat),t=topicOf(S.cat,S.topic);let out=`${c.name.toUpperCase()}\n${t.name} – Test ${S.test}\n\n`;
  for(const p of groupParts(QZ.qs)){if(p.i)out+=p.i+"\n\n";if(p.p)out+=p.p+"\n\n";
    for(const i of p.idx){const q=QZ.qs[i];out+=`Question ${i+1}: ${q.q}\n`+q.o.map((o,j)=>`${L[j]}. ${o}`).join("    ")+"\n\n"}}
  if(withKey){out+="ĐÁP ÁN VÀ GIẢI THÍCH\n";QZ.qs.forEach((q,i)=>out+=`${i+1}. ${L[q.a]} – ${q.ex||""}\n`);
    const ss=[...new Set(QZ.qs.map(q=>q.s).filter(Boolean))];if(ss.length)out+="\nTAPESCRIPT\n"+ss.join("\n\n")+"\n"}
  return out;
}

function partScript(pn){return groupParts(QZ.qs)[pn].s}
function setStat(pn,txt,pct){const s=$("ps"+pn),b=$("pb"+pn);if(s)s.textContent=txt;if(b&&pct!=null)b.style.width=pct+"%"}
function stopAudio(){AU.run++;try{speechSynthesis.cancel()}catch(e){}if(AU.audio){AU.audio.pause();AU.audio=null}
  if(AU.part!=null)setStat(AU.part,"Đã dừng.",0);AU.part=null}
function beep(){return new Promise(r=>{try{const C=new (window.AudioContext||window.webkitAudioContext)(),o=C.createOscillator(),g=C.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(C.destination);o.start();setTimeout(()=>{o.stop();C.close();r()},700)}catch(e){r()}})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sayOnce(pn,text,run,label){
  return new Promise(res=>{
    const src=MP3[QZ.key+"#"+pn];
    if(src){const a=new Audio(src);AU.audio=a;a.playbackRate=AU.rate;
      a.ontimeupdate=()=>{if(run===AU.run&&a.duration)setStat(pn,label,a.currentTime/a.duration*100)};a.onended=()=>res();a.onerror=()=>{toast("Không phát được tệp này.");res()};
      a.play().catch(()=>res());return}
    try{const u=new SpeechSynthesisUtterance(text.replace(/^[A-Za-z .]+:\s*/gm,""));u.lang="en-GB";u.rate=AU.rate;
      const v=speechSynthesis.getVoices().find(v=>/en[-_]GB/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
      u.onboundary=ev=>{if(run===AU.run)setStat(pn,label,Math.min(100,ev.charIndex/text.length*100))};
      u.onend=()=>res();u.onerror=()=>res();speechSynthesis.speak(u)}
    catch(e){toast("Trình duyệt không hỗ trợ đọc to. Hãy nạp tệp MP3.");res()}
  });
}
async function playerAction(pn,act){
  if(act==="script"){const t=$("ts"+pn);t.hidden=!t.hidden;return}
  if(act==="stop"){stopAudio();return}
  if(act==="pause"){
    if(AU.audio){if(AU.audio.paused){AU.audio.play();setStat(pn,"Đang phát tiếp…")}else{AU.audio.pause();setStat(pn,"Đã tạm dừng.")}return}
    try{if(speechSynthesis.paused){speechSynthesis.resume();setStat(pn,"Đang phát tiếp…")}else if(speechSynthesis.speaking){speechSynthesis.pause();setStat(pn,"Đã tạm dừng.")}}catch(e){}return}
  stopAudio();const run=++AU.run;AU.part=pn;const text=partScript(pn);
  if(act==="once"){setStat(pn,"Đang phát…",0);await beep();if(run!==AU.run)return;await sayOnce(pn,text,run,"Đang phát…");if(run===AU.run){setStat(pn,"Đã phát xong.",100);AU.part=null}return}
  if(act==="exam"){
    setStat(pn,"Tín hiệu bắt đầu…",0);await beep();if(run!==AU.run)return;
    await sayOnce(pn,text,run,"Lần nghe 1/2…");if(run!==AU.run)return;
    for(let s=10;s>0;s--){setStat(pn,`Nghỉ ${s} giây trước lần nghe thứ hai…`,100);await wait(1000);if(run!==AU.run)return}
    await beep();if(run!==AU.run)return;
    await sayOnce(pn,text,run,"Lần nghe 2/2…");if(run!==AU.run)return;
    await beep();setStat(pn,"Kết thúc phần nghe.",100);AU.part=null;
  }
}

let AIJOB=null;
function extractJSON(t){t=String(t||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("no json");return JSON.parse(t.slice(a,b+1))}
function cleanTest(tst){
  const out=[];
  for(const p of (tst.parts||[])){
    const i=String(p.instruction||"").trim(),s=String(p.script||"").trim(),pa=String(p.passage||"").trim();
    for(const q of (p.questions||[])){
      const o=(q.options||[]).map(x=>String(x).trim()).filter(Boolean).slice(0,4);const a=Number(q.answer);
      if(!q.q||o.length<2||!Number.isInteger(a)||a<0||a>=o.length)continue;
      const it={q:String(q.q).trim(),o,a,ex:String(q.explanation||"").trim()};if(i)it.i=i;if(s)it.s=s;if(pa)it.p=pa;out.push(it);
    }
  }
  return out;
}
function buildPrompt(c,t,nums,spec,avoid,partNote){
  return `Bạn là giáo viên tiếng Anh THPT tại Việt Nam, chuyên ra đề thi. Hãy soạn nội dung MỚI và nguyên bản (không chép từ sách hay đề đã xuất bản) cho hạng mục:
- Chuyên mục: ${c.name}
- Chuyên đề / dạng: ${t.name}${t.desc?" ("+t.desc+")":""}
- Cần soạn các đề: ${nums.map(n=>"Test "+n).join(", ")}${partNote||""}

Yêu cầu cho MỖI đề: ${spec}
Không trùng với các câu đã có sau đây:
${avoid.slice(0,50).map(s=>"- "+s).join("\n")||"(chưa có)"}

Quy tắc:
- Lệnh dẫn (instruction), câu hỏi, phương án, script và passage viết bằng tiếng Anh chuẩn; "explanation" viết bằng tiếng Việt, ngắn gọn, nêu lý do đáp án đúng (không nhắc tới chữ cái A/B/C/D).
- Mỗi câu có đúng một đáp án đúng; "answer" là chỉ số bắt đầu từ 0. Phân bố đáp án đúng đều giữa A, B, C, D.
- Dùng "___" cho chỗ trống trong câu đơn; chỗ trống trong đoạn văn ghi "(n) ___".
- Ngữ cảnh gần gũi với học sinh Việt Nam; thông tin thực tế phải chính xác.
- Nhóm các câu cùng lệnh dẫn vào một part; script hoặc passage đặt ở part, để chuỗi rỗng nếu không có. Lệnh dẫn theo phong cách đề thi Việt Nam, ví dụ "Read the following passage and mark the letter A, B, C or D to indicate …".

Chỉ trả về một đối tượng JSON, không kèm lời giải thích nào khác, theo đúng cấu trúc:
{"tests":[{"test":${nums[0]},"parts":[{"instruction":"...","script":"","passage":"","questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}]}]}`;
}
async function geminiCall(prompt,opts){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(CFG.gmodel)}:generateContent?key=${encodeURIComponent(CFG.gkey)}`;
  let r;
  try{r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},signal:opts.signal,body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.9}})})}
  catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};throw {code:"network",message:"Không kết nối được tới Gemini."}}
  if(!r.ok){const t=await r.text();throw {code:"api",message:`Gemini báo lỗi ${r.status}. Kiểm tra lại khóa API và tên mô hình. ${t.slice(0,160)}`}}
  const j=await r.json();const c=(j.candidates||[])[0]||{};
  return {text:((c.content||{}).parts||[]).map(p=>p.text||"").join(""),truncated:c.finishReason==="MAX_TOKENS"};
}
function aiEngine(){return SAMPLE?SAMPLE:(CFG.gkey?geminiCall:null)}
async function aiGenerate(catId,topicId,nums,statusEl){
  const ENGINE=aiEngine();
  if(!ENGINE){toast("Chưa có khóa Gemini API. Nhập khóa ở tab Tạo đề bằng AI.");return 0}
  if(AIJOB){toast("Đang có một lượt tạo đề, hãy chờ xong.");return 0}
  const c=catById(catId),t=topicOf(catId,topicId);
  const specs=[].concat(specFor(c,t));if(specs.length>1)nums=nums.slice(0,1);
  const avoid=[];for(let i=1;i<=10;i++)getQs(K(catId,topicId,i)).forEach(q=>avoid.push(q.q.split("\n")[0].slice(0,90)));
  const ctl=new AbortController();AIJOB={ctl};
  const set=(m)=>{if(statusEl)statusEl.textContent=m};
  updateAiButtons();
  const acc={};nums.forEach(n=>acc[n]=[]);
  let made=0;
  try{
    for(let si=0;si<specs.length;si++){
      const tag=specs.length>1?` (phần ${si+1}/${specs.length})`:"";
      set(`Đang suy nghĩ${tag}… thường mất 30 giây đến 2 phút`);
      const prompt=buildPrompt(c,t,nums,specs[si],avoid,specs.length>1?`\n- Đây là phần ${si+1}/${specs.length} của cùng một đề; chỉ soạn đúng phần được yêu cầu.`:"");
      const {text,truncated}=await ENGINE(prompt,{signal:ctl.signal,modelTier:"default",cache:false,onText:({text})=>set(`Đang viết đề${tag}… ${text.length.toLocaleString("vi-VN")} ký tự`)});
      let data;try{data=extractJSON(text)}catch(e){set(truncated?"Câu trả lời bị cắt ngắn. Hãy thử lại.":"Không đọc được kết quả. Hãy thử lại.");return 0}
      for(const tst of (data.tests||[])){const n=Number(tst.test)||nums[0];if(acc[n])acc[n].push(...cleanTest(tst))}
    }
    for(const n of nums){if(!acc[n].length)continue;await saveTest(K(catId,topicId,n),acc[n],"ai");made++}
    set(made?`Đã tạo ${made} đề cho ${t.name} (${nums.filter(n=>acc[n].length).map(n=>"Test "+n+": "+acc[n].length+" câu").join(", ")}).`:"Không có đề hợp lệ trong kết quả. Hãy thử lại.");
    onData();
  }catch(e){
    const m={cancelled:"Đã dừng.",not_granted:"Bạn chưa cho phép trang dùng Claude. Hãy bấm lại và chọn Cho phép.",rate_limited:"Đang tạo quá nhiều. Hãy chờ một lúc rồi thử lại."}[e&&e.code];
    set(m||("Có lỗi khi tạo đề"+(e&&e.message?": "+e.message:".")));
  }finally{AIJOB=null;updateAiButtons()}
  return made;
}
function emptyNums(catId,topicId,from=1){const r=[];for(let i=from;i<=10;i++)if(!getQs(K(catId,topicId,i)).length)r.push(i);return r}
function updateAiButtons(){document.querySelectorAll("[data-ai]").forEach(b=>b.disabled=!!AIJOB||!aiEngine());const st=$("aiStop");if(st)st.hidden=!AIJOB}

  <div class="kpis"><div class="kpi"><span>Chuyên mục / chuyên đề</span><b>${CATS.length} / ${CATS.reduce((a,c)=>a+c.topics.length,0)}</b></div><div class="kpi"><span>Đề có nội dung</span><b id="kpiFill"></b></div><div class="kpi"><span>Câu hỏi trong kho</span><b id="kpiQ"></b></div><div class="kpi"><span>Thẻ flashcard</span><b>${allCards().length}</b></div></div>

}
function updateKpis(){const tot=CATS.reduce((a,c)=>a+c.topics.length*10,0),f=CATS.reduce((a,c)=>a+catFilled(c),0);$("kpiFill").textContent=`${f} / ${tot}`;$("kpiQ").textContent=CATS.reduce((a,c)=>a+catCount(c),0)}
function aKey(){return K($("aC").value,$("aT").value,$("aN").value)}
function fillTopics(){const c=catById($("aC").value);$("aT").innerHTML=c.topics.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}
function aRefresh(){
  const k=aKey(),qs=getQs(k),src=srcOf(k);

function renderAiTable(){

function adminInit(){
  updateKpis();
  if($("aC")){if(AKEEP.c)$("aC").value=AKEEP.c;fillTopics();if(AKEEP.t)$("aT").value=AKEEP.t;if(AKEEP.n)$("aN").value=AKEEP.n;EDIT=null;aRefresh();

    $("aC").onchange=()=>{fillTopics();keep();aRefresh()};$("aT").onchange=()=>{keep();aRefresh()};$("aN").onchange=()=>{keep();aRefresh()}}

function resetForm(){if(!$("fQ"))return;["fQ","fA","fB","fC","fD","fE"].forEach(x=>$(x).value="");$("fTitle").textContent="➕ Thêm câu hỏi mới vào đề đang chọn";$("fSave").textContent="💾 Lưu câu hỏi";$("fCancel").hidden=true}
function parseBulk(text){const out=[];
  for(const block of text.replace(/\r/g,"").split(/\n\s*\n/)){const ls=block.split("\n").map(l=>l.trim()).filter(Boolean);if(!ls.length)continue;
    const o=[];let q=[],a=null,ex="";
    for(const l of ls){let m;
      if((m=l.match(/^([A-D])[\.\)\:]\s*(.*)$/)))o["ABCD".indexOf(m[1])]=m[2];
      else if((m=l.match(/^(đáp án|dap an|answer|key)\s*[:\-]?\s*([A-D])\b/i)))a="ABCD".indexOf(m[2].toUpperCase());
      else if((m=l.match(/^(giải thích|giai thich|explanation)\s*[:\-]?\s*(.*)$/i)))ex=m[2];
      else if(!o.length)q.push(l.replace(/^(câu|cau|question)\s*\d+\s*[:\.\)]?\s*/i,"").replace(/^\d+[\.\)]\s*/,""))}
    const opts=o.filter(x=>x!=null);
    if(q.length&&opts.length>=2&&a!==null&&a<opts.length)out.push({q:q.join(" "),o:opts,a,ex})}
  return out}
$("main").addEventListener("click",async e=>{

  if(id==="aOpen"){const[c,t,n]=aKey().split("|");if(!getQs(aKey()).length){toast("Đề này chưa có câu hỏi.");return}openTest(c,t,+n);return}
  if(id==="aAiOne"){const[c,t,n]=aKey().split("|");const st=$("aStat");st.hidden=false;await aiGenerate(c,t,[+n],st);return}

  if(b.dataset.ait){await aiGenerate($("aiCat").value,b.dataset.ait,emptyNums($("aiCat").value,b.dataset.ait).slice(0,catById($("aiCat").value).per),$("aiStat"));return}
  if(id==="aClear"){if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Bấm lần nữa để xóa hết câu của đề";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="🗑 Xóa trắng đề"}},3500);return}
    await saveTest(aKey(),[],"edit");aRefresh();renderSide();toast("Đã xóa trắng đề");return}

  if(b.dataset.eq!=null){const q=getQs(aKey())[+b.dataset.eq];EDIT=+b.dataset.eq;$("fI").value=q.i||"";$("fQ").value=q.q;["fA","fB","fC","fD"].forEach((x,j)=>$(x).value=q.o[j]||"");$("fAns").value=q.a;$("fE").value=q.ex||"";$("fP").value=q.p||"";$("fS").value=q.s||"";
    $("fTitle").textContent=`✎ Sửa câu ${EDIT+1}`;$("fSave").textContent="💾 Cập nhật câu hỏi";$("fCancel").hidden=false;$("fTitle").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(id==="fCancel"){EDIT=null;resetForm();return}
  if(b.dataset.dq!=null){const qs=[...getQs(aKey())];qs.splice(+b.dataset.dq,1);await saveTest(aKey(),qs,"edit");EDIT=null;resetForm();aRefresh();renderSide();toast("Đã xóa câu hỏi");return}
  if(id==="fSave"){const q=$("fQ").value.trim(),o=["fA","fB","fC","fD"].map(x=>$(x).value.trim()).filter(Boolean),a=+$("fAns").value;
    if(!q||o.length<2){toast("Cần nhập câu hỏi và ít nhất 2 phương án.");return}if(a>=o.length){toast("Đáp án đúng phải là một phương án đã nhập.");return}
    const it={q,o,a,ex:$("fE").value.trim()};if($("fI").value.trim())it.i=$("fI").value.trim();if($("fP").value.trim())it.p=$("fP").value.trim();if($("fS").value.trim())it.s=$("fS").value.trim();
    const qs=[...getQs(aKey())];if(EDIT!=null)qs[EDIT]=it;else qs.push(it);
    await saveTest(aKey(),qs,"edit");toast(EDIT!=null?"Đã cập nhật câu hỏi":"Đã lưu câu hỏi");EDIT=null;resetForm();aRefresh();renderSide();return}
  if(id==="iSample"){$("iT").value="Câu 1: She ___ to school by bike every day.\nA. go\nB. goes\nC. going\nD. gone\nĐáp án: B\nGiải thích: Chủ ngữ số ít, thì hiện tại đơn.\n\nCâu 2: I look forward to ___ from you soon.\nA. hear\nB. heard\nC. hearing\nD. be heard\nĐáp án: C\nGiải thích: Look forward to + V-ing.";return}
  if(id==="iAdd"||id==="iRep"){const qs=parseBulk($("iT").value);if(!qs.length){toast("Không đọc được câu nào. Kiểm tra lại định dạng.");return}
    await saveTest(aKey(),id==="iRep"?qs:[...getQs(aKey()),...qs],"edit");$("iT").value="";aRefresh();renderSide();toast(`Đã thêm ${qs.length} câu vào đề`);return}
  if(id==="cAdd"){const w=$("cW").value.trim(),vi=$("cV").value.trim();if(!w||!vi){toast("Cần nhập từ và nghĩa.");return}XCARDS=[...XCARDS,{w,k:$("cK").value.trim()||"vocabulary",vi,ex:$("cE").value.trim()}];await saveCards();renderMain();toast("Đã thêm thẻ");return}
  if(b.dataset.dc!=null){XCARDS=XCARDS.filter((_,i)=>i!==+b.dataset.dc);await saveCards();renderMain();return}
  if(id==="hCsv"){const rows=[["Thoi diem","Chuyen muc","De","Dung","Tong","Ty le","Diem","Giay"],...HIST.map(h=>[h.date,h.cat,h.title,h.right,h.total,h.pct,h.score,h.used])];copyText(rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"),"Đã sao chép bảng điểm. Dán vào Excel hoặc Google Sheets.");return}
  if(id==="hDel"){if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Bấm lần nữa để xóa hết";return}HIST=[];BEST={};store.set("bl_hist",HIST);store.set("bl_best",BEST);renderMain();renderSide();toast("Đã xóa lịch sử");return}
  if(id==="bkOut"){const t=JSON.stringify({tests:TESTS,cards:XCARDS},null,1);$("bk").value=t;copyText(t,"Đã sao chép dữ liệu");return}
  if(id==="bkIn"){importBk($("bk").value);return}
  if(id==="kxOut"){exportKho();return}

  if(id==="pubDl"){const data={tests:Object.assign({},PUB.tests,DRAFT),cards:XCARDS};const blob=new Blob([JSON.stringify(data)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tests.json";document.body.appendChild(a);a.click();a.remove();toast("Đã tải tệp tests.json");return}

$("main").addEventListener("change",e=>{if(e.target.id==="kxIn"&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>previewKho(r.result,f.name);r.readAsText(f);e.target.value="";return}if(e.target.id==="bkF"&&e.target.files[0]){const r=new FileReader();r.onload=()=>importBk(r.result);r.readAsText(e.target.files[0]);e.target.value=""}});
function khoData(){
  const tests={};
  for(const k of new Set([...Object.keys(BANK),...Object.keys(TESTS)])){const qs=getQs(k);if(qs.length)tests[k]={qs,src:srcOf(k)}}
  return {format:"b-lingo-kho-de",version:1,exportedAt:new Date().toISOString(),tests,cards:XCARDS};
}
async function exportKho(){
  const d=khoData(),nT=Object.keys(d.tests).length,nQ=Object.values(d.tests).reduce((a,v)=>a+v.qs.length,0);
  const txt=JSON.stringify(d),name=`b-lingo-kho-de-${new Date().toISOString().slice(0,10)}.json`;
  let dl=null;try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:txt});toast(`Đã xuất ${nT} đề, ${nQ} câu`)}
    catch(e){if(e&&e.code==="declined")toast("Đã hủy tải tệp.");else if(e&&e.code==="rate_limited")toast("Đang có một hộp thoại tải tệp mở, hãy chờ rồi thử lại.");else showCopy(txt)}
    return}
  if(STANDALONE_DL()){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast(`Đã xuất ${nT} đề, ${nQ} câu`);return}
  showCopy(txt);
}
function STANDALONE_DL(){return !(window.claude&&window.claude.use)}
function previewKho(text,fname){
  let d;try{d=JSON.parse(text)}catch(e){toast("Tệp không phải JSON hợp lệ.");return}
  const src=d&&d.tests&&typeof d.tests==="object"?d.tests:null;
  if(!src){toast("Tệp không đúng định dạng kho đề B-Lingo (thiếu mục tests).");return}
  const ok={};let nQ=0,skip=0;
  for(const k in src){const v=src[k];const qs=(v&&Array.isArray(v.qs)?v.qs:Array.isArray(v)?v:[]).filter(q=>q&&q.q&&Array.isArray(q.o)&&q.o.length>=2&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length);
    if(k.split("|").length===3&&qs.length){ok[k]={qs,src:(v&&v.src)||"edit"};nQ+=qs.length}else skip++}
  const keys=Object.keys(ok),over=keys.filter(k=>getQs(k).length).length,cards=Array.isArray(d.cards)?d.cards.filter(c=>c&&c.w):null;
  if(!keys.length&&!cards){toast("Không tìm thấy đề hợp lệ trong tệp.");return}
  modal(`<h3>⬆ Nhập kho đề</h3><p style="margin:0">Tệp <b>${esc(fname)}</b> có <b>${keys.length} đề</b> (${nQ} câu)${cards?`, ${cards.length} thẻ flashcard`:""}.</p>${over?`<p class="muted" style="margin:0;font-size:14px">${over} đề trùng với đề đang có sẽ được thay bằng nội dung trong tệp. Các đề khác giữ nguyên.</p>`:""}${skip?`<p class="muted" style="margin:0;font-size:14px">Bỏ qua ${skip} mục không hợp lệ.</p>`:""}<div class="aistat" id="kxStat" hidden></div><div class="row"><button class="btn pri" id="kxGo">Nhập ${keys.length} đề</button><button class="btn" data-close>Hủy</button></div>`);
  $("kxGo").onclick=async()=>{
    const b=$("kxGo");b.disabled=true;const st=$("kxStat");st.hidden=false;let i=0;
    try{for(const k of keys){i++;st.textContent=`Đang nhập ${i}/${keys.length}…`;await saveTest(k,ok[k].qs,ok[k].src)}
      if(cards){XCARDS=cards;await saveCards()}
      closeModal();onData();renderMain();renderSide();toast(`Đã nhập ${keys.length} đề, ${nQ} câu`)}
    catch(e){st.textContent=`Dừng ở đề ${i}/${keys.length}: không lưu được. Các đề trước đó đã nhập.`;b.disabled=false}
  };
}
async function importBk(t){try{const d=JSON.parse(t);let n=0;
  for(const k in (d.tests||{})){const v=d.tests[k];if(v&&Array.isArray(v.qs)){await saveTest(k,v.qs.filter(q=>q&&q.q&&Array.isArray(q.o)),v.src||"edit");n++}}
  if(Array.isArray(d.cards)){XCARDS=d.cards.filter(c=>c&&c.w);await saveCards()}
  renderMain();renderSide();toast(`Đã khôi phục ${n} đề`)}catch(e){toast("Dữ liệu không đúng định dạng đã sao lưu.")}}

try{speechSynthesis.getVoices()}catch(e){}
tick();render();
